name: build-check

# Fails when docs/index.html, llms.txt or llms-full.txt are out of sync with
# docs/data/index.json. Fix locally with: node scripts/build.mjs

on:
  pull_request:
    paths: ["docs/**", "scripts/**"]
  push:
    branches: [main]
    paths: ["docs/**", "scripts/**"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build.mjs --check
